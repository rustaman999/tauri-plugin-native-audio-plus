[package]
name = "tauri-plugin-native-audio-plus"
version = "1.0.6"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-native-audio"
description = "Native audio playback plugin for Tauri - unified API for Android/iOS/Desktop (rodio + http streaming)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustaman999/tauri-plugin-native-audio-plus"
homepage = "https://github.com/rustaman999/tauri-plugin-native-audio-plus"
documentation = "https://docs.rs/tauri-plugin-native-audio-plus"
keywords = ["tauri", "plugin", "audio", "media", "mobile", "desktop", "rodio"]
categories = ["multimedia::audio"]

[lib]
name = "tauri_plugin_native_audio"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.10.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "5"
rodio = { version = "0.20", features = ["flac", "mp3", "vorbis", "wav"] }
ureq = { version = "2.10", features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = ["build"] }
